<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión · Archivos ICFD</title>
  <!-- Tipografías Institucionales ICFD -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card-split">
      <!-- Panel Institucional ICFD -->
      <div class="hero-panel">
        <div class="hero-seal">
          <img src="/static/img/logo.png" alt="Logo ICFD" />
        </div>
        <div class="hero-eyebrow">Corporación</div>
        <h1 class="hero-title">Iglesia Cristiana Internacional<br />Familia de Dios</h1>
        <div class="hero-rule"><i class="fas fa-diamond"></i></div>
        <div class="hero-subtitle">Repositorio y Servidor de Archivos</div>
      </div>

      <!-- Panel de Formulario -->
      <div class="form-panel">
        <div>
          <h2 class="form-title">Iniciar sesión</h2>
          <p class="form-sub">Ingrese sus credenciales para acceder al sistema.</p>

          <form id="loginForm">
            <div id="loginError" class="alert-error hidden"></div>

            <div class="form-group">
              <label for="username" class="form-label">Usuario</label>
              <div class="input-group-custom">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="username" name="username" class="form-control-icfd" placeholder="Nombre de usuario" required autocomplete="username" autofocus />
              </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-group-custom">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" name="password" class="form-control-icfd" placeholder="Contraseña" required autocomplete="current-password" />
                <button type="button" class="btn-toggle-password" id="togglePassword" title="Mostrar u ocultar contraseña">
                  <i class="fas fa-eye" id="togglePasswordIcon"></i>
                </button>
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-login">Ingresar</button>
          </form>
        </div>

        <div class="login-footer">
          <span><i class="fas fa-lock"></i> Acceso restringido</span>
          <span>Archivos ICFD v2.0 · 2026</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const icon = document.getElementById('togglePasswordIcon');
    if (toggleBtn && passwordInput && icon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        icon.classList.toggle('fa-eye', !isPassword);
        icon.classList.toggle('fa-eye-slash', isPassword);
      });
    }

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = '/';
        } else {
          errorBox.textContent = data.error || 'Error de autenticación';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.textContent = 'No se pudo conectar con el servidor.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
