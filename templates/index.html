<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python File Server</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- Dropzone Overlay Global -->
  <div id="dropOverlay" class="drop-overlay hidden">
    <div class="drop-box">
      <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <h2>Suelta tus archivos aquí</h2>
      <p>Se subirán a la carpeta actual</p>
    </div>
  </div>

  <!-- Navbar Superior -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand" id="brandHome" title="Ir a la raíz">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <span class="brand-title">File Server</span>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="searchInput" placeholder="Buscar archivos o carpetas..." autocomplete="off" />
      </div>
    </div>

    <div class="topbar-right">
      <div class="disk-info" id="diskInfo" title="Espacio en disco">
        <div class="disk-text">
          <span id="diskLabel">Cargando disco...</span>
        </div>
        <div class="disk-bar">
          <div class="disk-fill" id="diskFill" style="width: 0%"></div>
        </div>
      </div>

      <button class="btn btn-icon" id="themeToggleBtn" title="Cambiar tema (Claro / Oscuro)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="btn btn-outline btn-sm" id="logoutBtn" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="hide-mobile">Salir</span>
      </button>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="container">
    <!-- Barra de acciones y Breadcrumbs -->
    <div class="toolbar">
      <nav class="breadcrumbs" id="breadcrumbs" aria-label="Ruta actual"></nav>

      <div class="toolbar-actions">
        <input type="file" id="fileInput" multiple class="hidden" />
        <button class="btn btn-primary" id="uploadBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Subir Archivos</span>
        </button>

        <button class="btn btn-secondary" id="newFolderBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            <line x1="12" y1="11" x2="12" y2="17"></line>
            <line x1="9" y1="14" x2="15" y2="14"></line>
          </svg>
          <span>Nueva Carpeta</span>
        </button>

        <button class="btn btn-outline" id="downloadZipBtn" title="Descargar carpeta actual en ZIP">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="hide-mobile">ZIP</span>
        </button>
      </div>
    </div>

    <!-- Barra de progreso de subida -->
    <div id="uploadProgressPanel" class="upload-panel hidden">
      <div class="upload-panel-header">
        <span id="uploadStatusText">Subiendo archivos...</span>
        <span id="uploadPercentText">0%</span>
      </div>
      <div class="progress-track">
        <div id="uploadProgressBar" class="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Tabla de Archivos -->
    <div class="card file-card">
      <div class="table-responsive">
        <table class="file-table">
          <thead>
            <tr>
              <th class="col-name">Nombre</th>
              <th class="col-size">Tamaño</th>
              <th class="col-date">Modificado</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="fileTableBody">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>

      <!-- Estado vacío -->
      <div id="emptyState" class="empty-state hidden">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <h3>Esta carpeta está vacía</h3>
        <p>Arrastra archivos aquí o usa el botón "Subir Archivos" para comenzar.</p>
      </div>
    </div>
  </main>

  <!-- Modal Genérico (Crear carpeta / Renombrar) -->
  <div id="promptModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="promptModalTitle">Título</h3>
        <button class="btn-close" id="promptCloseBtn">&times;</button>
      </div>
      <form id="promptForm">
        <div class="modal-body">
          <label id="promptModalLabel" for="promptInput">Nombre</label>
          <input type="text" id="promptInput" required autocomplete="off" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="promptCancelBtn">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="promptConfirmBtn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Vista Previa -->
  <div id="previewModal" class="modal-backdrop hidden">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="previewTitle">Vista Previa</h3>
        <button class="btn-close" id="previewCloseBtn">&times;</button>
      </div>
      <div class="modal-body preview-container" id="previewContent"></div>
      <div class="modal-footer">
        <a id="previewDownloadBtn" href="#" class="btn btn-primary" download>Descargar Archivo</a>
      </div>
    </div>
  </div>

  <!-- Contenedor de Notificaciones Toast -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>
